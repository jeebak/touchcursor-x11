# ~/.config/keyd/app.conf
# ─────────────────────────────────────────────────────────────────────────────
# keyd-application-mapper configuration.
# Read by the `keyd-application-mapper` daemon (runs alongside keyd).
# Maps window classes to layers defined in /etc/keyd/default.conf.
#
# Discover your app's window class:
#   xprop | grep WM_CLASS    (click the window after running)
#
# Run the mapper:
#   keyd-application-mapper -d    # daemonize; add to session autostart
# ─────────────────────────────────────────────────────────────────────────────

# ── Remote desktop / VM apps → passthrough ───────────────────────────────────
# Disables all TouchCursor/Tab-modifier overloads so the remote machine
# receives raw keys (mirrors macOS: frontmost_application_unless these apps).
# Window classes to verify with xprop — names may differ by distro/version:
[rdesktop|Remmina|vinagre|virt-manager|virt-viewer|xfreerdp|vncviewer|Vncviewer]
layer = passthrough

# ── Terminals → Ctrl+Shift clipboard + tab shortcuts ─────────────────────────
# Terminals reserve Ctrl+C for SIGINT, so cut/copy/paste/new-tab use
# Ctrl+Shift+<key> instead of the nav layer's default Ctrl+<key>. w/d cover
# tab navigation/close (the terminal's own Ctrl(+Shift)+PageDown /
# Ctrl+Shift+W, not the nav layer's C-tab / C-w, which don't apply inside a
# terminal tab strip). Overrides the EXISTING [nav] layer directly
# (`<layer>.<key> = <action>`, per `man keyd.rvaiya` Bindings) — keyd-
# application-mapper has no `layer = X` directive; there is no `[term]`/
# `[nav_term]` layer in default.conf.
# Window class matched here is WM_CLASS's CLASS field (2nd string, not the
# WM_INSTANCE), lowercased: confirmed via `xprop | grep WM_CLASS` as
# "Gnome-terminal" -> gnome-terminal, "Xfce4-terminal" -> xfce4-terminal.
#
# NOTE: [X|Y] is NOT an OR of classes -- keyd-application-mapper's own
# parser (parse_config in /usr/bin/keyd-application-mapper) splits on `|`
# and uses ONLY the first two pieces, as class AND title:
#   a = line[1:-1].split('|'); cls = a[0]; title = a[1] (or '*' if just one)
# [gnome-terminal|visor-terminal] therefore meant "class=gnome-terminal AND
# title=visor-terminal" -- which matches NO real window (confirmed live:
# clipboard overrides silently stopped working the moment this became a
# two-item filter). Separate class-only sections instead, each with '*'
# for title.
# nav.a: the base keyd config holds `a = overload(control, C-a)` for GUI
# apps (Space+A+<key> = Ctrl+<key>, the standard Linux/Windows word-nav
# convention). Terminals need Alt instead, to match readline/emacs
# conventions (Alt+Left/Right/Backspace word-nav, Alt+B/F/D) and Claude
# Code's own key handling for those same keys.
#
# gnome-terminal (Cinnamon's default) needs its OWN [visor-terminal] section
# below: its --class=<name> flag (see toggle-visor-terminal.bash) fully
# REPLACES the WM_CLASS class field, so the drop-down instance's class is
# literally "visor-terminal", not "gnome-terminal" -- [gnome-terminal] alone
# would never match it.
#
# xfce4-terminal (XFCE's default) needs no such second section: it has no
# --class/--name flag at all (confirmed via its man page -- only --role,
# which sets WM_WINDOW_ROLE, a property keyd-application-mapper doesn't
# match on). Its drop-down instance therefore keeps the SAME WM_CLASS as
# every regular window, so [xfce4-terminal] alone already covers both --
# toggle-visor-terminal.bash's --by-role dance exists purely so
# toggle-hotkey-window.bash can still find/toggle the ONE drop-down window
# among possibly-several regular ones; it's irrelevant to keyd's own
# per-app layer matching here.
#
# xfce4-terminal's tab/clipboard accelerators were confirmed by extracting
# `strings` from the actual /usr/bin/xfce4-terminal binary (its defaults
# aren't in a plain-text file -- they're compiled-in GtkAccelMap entries),
# not by running it live yet on the X220. Copy/Paste (adjacent to their own
# "_Copy"/"_Paste" label strings in the binary) and Close Tab (Ctrl+Shift+W,
# matching gnome-terminal) are high-confidence. Next/Prev Tab is
# Ctrl+Shift+Page_Down/Up (SHIFTED, unlike gnome-terminal's plain
# Ctrl+PageDown) -- confirmed only as an adjacent pair of accelerator
# strings in the binary, not from a live Preferences → Shortcuts check.
# Verify nav.w live once the X220 is running XFCE (Space+W in two open tabs
# should advance to the next one); fix here if it doesn't.
[gnome-terminal]
nav.a = overload(alt, C-a)
nav.w = C-pagedown
nav.d = C-S-w
nav.x = C-S-x
nav.c = C-S-c
nav.v = S-insert
nav., = C-S-t

[visor-terminal]
nav.a = overload(alt, C-a)
nav.w = C-pagedown
nav.d = C-S-w
nav.x = C-S-x
nav.c = C-S-c
nav.v = S-insert
nav., = C-S-t

[xfce4-terminal]
nav.a = overload(alt, C-a)
nav.w = C-S-pagedown
nav.d = C-S-w
nav.x = C-S-x
nav.c = C-S-c
nav.v = S-insert
nav., = C-S-t
